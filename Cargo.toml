[workspace]
resolver = "2"
members = [
    "crates/smbn-core",
    "crates/smbn-win",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jzl2163/smbn"
authors = ["jzl2163"]

[workspace.dependencies]
anyhow = "1.0"
base64 = "=0.22.1"
native-windows-gui = { version = "=1.0.13", default-features = false }
rand = "=0.9.2"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
thiserror = "=2.0.16"
unicode-segmentation = "=1.12.0"
zeroize = "=1.8.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-amdv3]
inherits = "release"
lto = "fat"
codegen-units = 1
