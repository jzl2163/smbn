name: windows-ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.82
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.82.0
          target: x86_64-pc-windows-msvc
          components: rustfmt, clippy
          cache: true

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore .NET dependencies
        shell: pwsh
        run: dotnet restore engine/Smbn.Engine/Smbn.Engine.csproj

      - name: Validate source
        shell: pwsh
        run: ./scripts/check.ps1 -SkipRestore

      - name: Build baseline package
        shell: pwsh
        run: ./scripts/build.ps1 -CpuProfile baseline -SkipChecks

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: smbn-baseline
          path: |
            artifacts/smbn-baseline.zip
            artifacts/smbn-baseline.zip.sha256
          if-no-files-found: error
          retention-days: 14
