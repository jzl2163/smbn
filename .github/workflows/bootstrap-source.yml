name: bootstrap-source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/smbn-source.b64
          base64 -d /tmp/smbn-source.b64 > /tmp/smbn-source.tar.gz
          tar -xzf /tmp/smbn-source.tar.gz -C .

      - name: Replace bootstrap files and regenerate manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          find . -type f \
            ! -path './.git/*' \
            ! -path './target/*' \
            ! -path './artifacts/*' \
            ! -name 'SOURCE-MANIFEST.sha256' \
            -print0 | sort -z | xargs -0 sha256sum > SOURCE-MANIFEST.sha256

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: import SMBN source"
          git push origin HEAD:main
